[package]
name = "tomny-runtime"
version = "0.1.0"
edition = "2021"
description = "Native runtime sidecar for Tomny Core"
license = "Apache-2.0"

[lib]
name = "tomny_runtime"
path = "src/lib.rs"

[[bin]]
name = "tomny-runtime"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
