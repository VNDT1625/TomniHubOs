<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none';script-src 'unsafe-inline';style-src 'unsafe-inline';connect-src 'none';img-src data:;font-src 'none';object-src 'none';base-uri 'none';form-action 'none'"
    />
    <title>Calculator</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: ui-rounded, 'Segoe UI', sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        color: CanvasText;
        background: Canvas;
      }
      main {
        width: min(100%, 360px);
        padding: 24px;
      }
      .eyebrow {
        margin: 0 0 8px;
        font-size: 12px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        opacity: 0.62;
      }
      h1 {
        margin: 0 0 18px;
        font-size: 28px;
        font-weight: 650;
      }
      output {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        min-height: 76px;
        margin-bottom: 14px;
        padding: 12px 16px;
        overflow: hidden;
        border: 1px solid color-mix(in srgb, CanvasText 18%, transparent);
        border-radius: 16px;
        background: color-mix(in srgb, CanvasText 6%, transparent);
        font-size: 34px;
        font-variant-numeric: tabular-nums;
      }
      .keys {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
      }
      button {
        min-height: 56px;
        border: 1px solid color-mix(in srgb, CanvasText 16%, transparent);
        border-radius: 14px;
        color: CanvasText;
        background: color-mix(in srgb, CanvasText 7%, Canvas);
        font: inherit;
        font-size: 18px;
        cursor: pointer;
        transition:
          transform 120ms ease,
          background 120ms ease;
      }
      button:hover {
        background: color-mix(in srgb, Highlight 18%, Canvas);
      }
      button:active {
        transform: scale(0.96);
      }
      button:focus-visible {
        outline: 3px solid Highlight;
        outline-offset: 2px;
      }
      .operator {
        color: Highlight;
        font-weight: 700;
      }
      .equals {
        color: HighlightText;
        background: Highlight;
        font-weight: 700;
      }
      .wide {
        grid-column: span 2;
      }
      @media (prefers-reduced-motion: reduce) {
        button {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main aria-labelledby="title">
      <p class="eyebrow">Tomny package</p>
      <h1 id="title">Calculator</h1>
      <output id="display" aria-live="polite" aria-label="Display">0</output>
      <section class="keys" aria-label="Calculator keypad">
        <button class="wide" data-action="clear">Clear</button><button data-action="sign">?</button
        ><button class="operator" data-operator="?">?</button><button data-digit="7">7</button
        ><button data-digit="8">8</button><button data-digit="9">9</button
        ><button class="operator" data-operator="?">?</button><button data-digit="4">4</button
        ><button data-digit="5">5</button><button data-digit="6">6</button
        ><button class="operator" data-operator="?">?</button><button data-digit="1">1</button
        ><button data-digit="2">2</button><button data-digit="3">3</button
        ><button class="operator" data-operator="+">+</button><button class="wide" data-digit="0">0</button
        ><button data-action="decimal">.</button><button class="equals" data-action="equals">=</button>
      </section>
    </main>
    <script>
      (() => {
        const d = document.getElementById('display');
        let c = '0',
          s = null,
          o = null,
          r = false;
        const v = () => {
          d.textContent = c;
        };
        const x = () => {
          if (s === null || o === null) return;
          const l = Number(s),
            n = Number(c),
            q = o === '+' ? l + n : o === '?' ? l - n : o === '?' ? l * n : n === 0 ? NaN : l / n;
          c = Number.isFinite(q) ? String(Number(q.toFixed(10))) : 'Error';
          s = null;
          o = null;
          r = true;
          v();
        };
        document.querySelector('.keys').addEventListener('click', (e) => {
          const k = e.target.closest('button');
          if (!k) return;
          const n = k.dataset.digit,
            p = k.dataset.operator,
            a = k.dataset.action;
          if (n !== undefined) {
            c = r || c === '0' || c === 'Error' ? n : c + n;
            r = false;
          } else if (p) {
            if (s !== null && !r) x();
            s = c;
            o = p;
            r = true;
          } else if (a === 'decimal' && !c.includes('.')) {
            c = r || c === 'Error' ? '0.' : c + '.';
            r = false;
          } else if (a === 'sign' && c !== '0' && c !== 'Error') {
            c = c.startsWith('-') ? c.slice(1) : '-' + c;
          } else if (a === 'clear') {
            c = '0';
            s = null;
            o = null;
            r = false;
          } else if (a === 'equals') x();
          v();
        });
      })();
    </script>
  </body>
</html>
